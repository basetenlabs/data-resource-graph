#
# Builds the docs and deploys to GitHub pages
#
# Not currently in use
#
# https://github.com/actions/setup-node
# Using https://github.com/marketplace/actions/deploy-to-github-pages
name: Deploy to Github pages

jobs:
  deploy_pages:
    runs-on: ubuntu-latest

    steps:
      - uses: chainguard-actions/actions-checkout@cb8b4f71d4f23febbe3347f6860f67c154995cad # v2.8.0
      - uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v7.1.0
        with:
          node-version: '12'
          cache: 'yarn'
      - run: yarn install
      - run: yarn docs

      - run: touch docs/.nojekyll
      - name: Deploy docs 🚀
        uses: chainguard-actions/JamesIves-github-pages-deploy-action@d50c9f6d77d7f22bc8707f7b307b91991789cdd6 # v4.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages # The branch the action should deploy to.
          folder: docs # The folder the action should deploy.
