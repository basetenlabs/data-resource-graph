name: Lint and test

on: [push]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nodejs: [16, 18]

    steps:
      - uses: chainguard-actions/actions-checkout@cb8b4f71d4f23febbe3347f6860f67c154995cad # v2.8.0

      # https://github.com/actions/setup-node
      - uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v7.1.0
        with:
          node-version: ${{ matrix.nodejs }}

      - run: yarn install
      - run: yarn test
      - run: yarn lint
      - run: yarn build-all
      - run: |
          if [[ $(git status --porcelain) ]]; then
            echo "Encountered uncommitted files:"
            git status --porcelain
            echo ""
            echo "You may need to run `yarn build-all`, commit any changes, and push again."
            exit 1
          fi
